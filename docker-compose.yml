services:

  # ---------------------------------------------------------------------------
  # MySQL: base de datos del microservicio (tambien guarda la tabla outbox_event
  # del patron Transactional Outbox). El healthcheck evita que la app arranque
  # antes de que MySQL acepte conexiones.
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: FOODV2
      MYSQL_USER: grobles
      MYSQL_PASSWORD: 12345678
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot123 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Kafka en modo KRaft (sin Zookeeper): un solo nodo que es broker y controller.
  # Dos listeners:
  #   - INTERNAL  kafka:29092     -> para los contenedores de esta red (nutrition-app)
  #   - EXTERNAL  localhost:9092  -> para herramientas desde tu maquina (kafka-ui, consola)
  # Los topics los crea la propia aplicacion al arrancar (KafkaConfig / NewTopic);
  # ademas se permite la autocreacion para pruebas manuales.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: nutrition-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Un solo broker: los topics internos no pueden tener factor de replicacion > 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Kafka UI (opcional): ver topics y mensajes en http://localhost:8085
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nutrition-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: nutrition-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  nutrition-app:
    image: ms-nutrition-planner:latest
    container_name: nutrition-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "7000:7000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/FOODV2?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/La_Paz
      SPRING_DATASOURCE_USERNAME: grobles
      SPRING_DATASOURCE_PASSWORD: 12345678
      # --- Mensajeria (Actividad 2) ---
      # Activa el relay del outbox y los listeners. Con false la app funciona
      # igual y los eventos quedan pendientes en outbox_event.
      KAFKA_ENABLED: "true"
      # Dentro de la red de Docker se usa el listener INTERNAL del broker
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: bc2.nutricion.eventos
      KAFKA_TOPIC_PACIENTES: bc1.pacientes.eventos
      KAFKA_TOPIC_CATERING: bc3.catering.eventos

volumes:
  mysql_data:
  kafka_data:
