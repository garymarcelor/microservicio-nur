spring.application.name=ms-nutrition-planner-test

# ==========================================
# BASE DE DATOS DE PRUEBA: H2 en memoria
# ==========================================
# Se usa H2 en modo de compatibilidad MySQL solo para los tests
# (unit tests de infraestructura e integration tests). En produccion
# se usa MySQL real (ver src/main/resources/application.properties).
spring.datasource.url=jdbc:h2:mem:foodtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
# A diferencia de produccion (ddl-auto=validate + script SQL manual),
# en tests dejamos que Hibernate genere el esquema a partir de las
# entidades, para no depender del script MySQL-especifico.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.level.org.hibernate.SQL=WARN
logging.level.com.nutrition.msnutritionplanner=INFO

# ==========================================
# KAFKA / OUTBOX (desactivado en tests)
# ==========================================
# El relay y los listeners de Kafka no se crean (app.kafka.enabled=false),
# pero el publicador del outbox si guarda filas en outbox_event (H2).
app.kafka.enabled=false
app.kafka.topic=bc2.nutricion.eventos
app.events.source=MSNutritionPlanner
app.kafka.consumo.pacientes-topic=bc1.pacientes.eventos
app.kafka.consumo.catering-topic=bc3.catering.eventos
