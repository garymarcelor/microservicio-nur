spring.application.name=ms-nutrition-planner
server.port=7000

# ==========================================
# MYSQL DATABASE
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
# En este proyecto la base de datos se crea/versiona con el script
# db/FOOD_CREATION.sql (incluye datos de ejemplo), por lo que se usa
# "validate" para que Hibernate NO modifique el esquema automaticamente.
# Cambiar a "update" solo en desarrollo temprano si se prefiere que
# Hibernate genere el esquema por si mismo.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# JACKSON
# ==========================================
spring.jackson.default-property-inclusion=non_null
#spring.jackson.serialization.write-dates-as-timestamps=false

# ==========================================
# LOGGING
# ==========================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.nutrition.msnutritionplanner=DEBUG

# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
