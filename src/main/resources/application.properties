spring.application.name=ms-nutrition-planner
server.port=7000

# ==========================================
# MYSQL DATABASE
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
# En este proyecto la base de datos se crea/versiona con el script
# db/FOOD_CREATION.sql (incluye datos de ejemplo), por lo que se usa
# "validate" para que Hibernate NO modifique el esquema automaticamente.
# Cambiar a "update" solo en desarrollo temprano si se prefiere que
# Hibernate genere el esquema por si mismo.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# JACKSON
# ==========================================
spring.jackson.default-property-inclusion=non_null
#spring.jackson.serialization.write-dates-as-timestamps=false

# ==========================================
# LOGGING
# ==========================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.nutrition.msnutritionplanner=DEBUG

# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==========================================
# KAFKA - MENSAJERIA ASINCRONA (Actividad 2)
# ==========================================
# Si Kafka esta apagado (app.kafka.enabled=false, valor por defecto) la app
# funciona igual: los eventos se guardan en la tabla outbox_event y quedan
# PENDIENTES hasta que se active Kafka (el relay y los listeners no se crean).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Productor: acks=all + idempotencia = sin perdida ni duplicados por reintentos de red
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Si el broker no responde, no bloquear el hilo mas de 5 s (por defecto son 60 s)
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Consumidor: group.id = nombre del servicio; un grupo nuevo lee desde el inicio
# (la tabla inbox_event evita procesar dos veces un mismo evento).
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.enabled=${KAFKA_ENABLED:false}
# Topic donde BC2 publica sus eventos (bc2.PlanBaseCreado, bc2.PlanPersonalizadoCreado, bc2.RecetaCreada)
app.kafka.topic=${KAFKA_TOPIC:bc2.nutricion.eventos}
# Topics de los que BC2 consume
app.kafka.consumo.pacientes-topic=${KAFKA_TOPIC_PACIENTES:bc1.pacientes.eventos}
app.kafka.consumo.catering-topic=${KAFKA_TOPIC_CATERING:bc3.catering.eventos}

# ==========================================
# TRANSACTIONAL OUTBOX
# ==========================================
app.outbox.poll-delay-ms=${OUTBOX_POLL_DELAY_MS:1000}
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
app.outbox.send-timeout-ms=5000
# Dias que se conservan las filas ya publicadas antes de borrarlas
app.outbox.retention-days=7
# Valor del campo "source" del sobre de los eventos (ver contrato)
app.events.source=MSNutritionPlanner
